name: Generate Auto Subtitle (via Link)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Paste Link Download Video Disini (Direct Link)'
        required: true
        default: ''
      model_type:
        description: 'Pilih model Whisper (tiny, base, small, medium, large)'
        required: true
        default: 'small'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update && sudo apt install -y ffmpeg
          # Sesuai saran README.md

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install library ffmpeg-python untuk memperbaiki error sebelumnya
          pip install ffmpeg-python
          # Install script langsung dari repo (cara paling bersih sesuai README)
          pip install .
          # Ini akan membaca setup.py dan menginstall openai-whisper otomatis

      - name: Download Video from URL
        run: |
          curl -L "${{ github.event.inputs.video_url }}" -o input_video.mp4

      - name: Run Auto Subtitle
        run: |
          # Menggunakan folder './output' sesuai keinginanmu di awal
          auto_subtitle "input_video.mp4" --model ${{ github.event.inputs.model_type }} --output_dir ./output --output_srt True

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: subtitled-video-result
          path: output/
