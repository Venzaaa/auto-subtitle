name: Generate Auto Subtitle (via Link)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'https://litter.catbox.moe/896ionklpdp3g4ci.mp4'
        required: true
        default: ''
      model_type:
        description: 'Ukuran model Whisper (tiny, base, small, medium, large)'
        required: true
        default: 'small'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Mengacu pada requirements.txt di Screenshot_20260514_144006.jpg
          pip install openai-whisper

      - name: Download Video from URL
        run: |
          # Menggunakan curl untuk download video dan menamainya 'input_video.mp4'
          curl -L "${{ github.event.inputs.video_url }}" -o input_video.mp4

      - name: Run Auto Subtitle
        run: |
          # Menjalankan script berdasarkan entry point di setup.py (Screenshot_20260514_144014.jpg)
          auto_subtitle "input_video.mp4" --model ${{ github.event.inputs.model_type }} --output_dir ./output --output_srt True

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: subtitled-video-result
          path: output/
